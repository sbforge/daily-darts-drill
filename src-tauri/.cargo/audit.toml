# Settings for `cargo audit` (the rust-audit job in .github/workflows/ci.yml runs it from src-tauri).
[advisories]
ignore = [
  # rsa (Marvin Attack): only listed in Cargo.lock, through sqlx's MySQL driver, which D³ doesn't enable.
  # `cargo tree -i rsa --target all` prints nothing: it is never built into the app. Recheck when sqlx changes.
  "RUSTSEC-2023-0071",
  # libsqlite3-sys 0.30 bundles SQLite < 3.54, which can return stale memory when it opens a crafted database together
  # with a crafted -wal file. No fixed version is reachable yet: tauri-plugin-sql (2.6 and the 3.0 alphas) needs
  # sqlx 0.8, which needs libsqlite3-sys ^0.30 (sqlx 0.9 stops below 0.38; 0.39 is the fix), and rusqlite must link
  # the same one. D³ only opens its own database, and on restore an outside file without its -wal
  # (restore::stage; exports are single files). Recheck when tauri-plugin-sql moves to libsqlite3-sys >= 0.39.
  "RUSTSEC-2026-0459",
]
