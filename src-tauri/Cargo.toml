[package]
name = "dart-trainer"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mdns-sd = "0.21.7"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
