name: Release

# A pushed tag v* (made by `npm version`) builds every platform into a DRAFT release; nothing reaches players
# until the draft is published. A manual run builds the branch picked in "Run workflow" and only keeps artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-22.04
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-version.js --check --tag "${{ github.ref_name }}"

  build:
    name: Build ${{ matrix.name }}
    needs: [version]
    # The version check is skipped on manual runs, which must not stop the build.
    if: ${{ !cancelled() && (needs.version.result == 'success' || needs.version.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi
            artifact: windows
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: macos-apple-silicon
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
            artifact: macos-intel
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            artifact: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install the Linux packages Tauri needs
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      # Draft first, publish last: a tag push creates (or fills) a draft release, a manual run only builds.
      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updates are signed in CI only; local builds work without the key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # tauri-action writes latest.json (all platforms, with signatures) into the draft release.
          includeUpdaterJson: true
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('D³ {0}', github.ref_name) || '' }}
          releaseDraft: true
          # v1.1.0-beta.1 and the like are pre-releases: "latest" ignores them, so no player is offered them.
          prerelease: ${{ github.ref_type == 'tag' && contains(github.ref_name, '-') }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":true}}'

      # The ad-hoc signature (signingIdentity "-") has to be complete, else Apple Silicon calls the app "damaged".
      - name: Verify the macOS signature
        if: startsWith(matrix.os, 'macos')
        run: |
          for app in src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
          done

      - name: Keep the installers of a manual run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          retention-days: 7
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
          if-no-files-found: error
