name: Build Tauri Release

on:
  release:
    types:
      - published
  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        # Every build names its target, so the installers land in target/<target>/release/bundle.
        # Intel Macs are cross-compiled on the Apple Silicon runner.
        include:
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows

          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-apple-silicon

          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-intel

    runs-on: ${{ matrix.os }}

    steps:
      # A release builds its tag; a manual run (for testing) builds the branch picked in "Run workflow".
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri application
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Manual test runs have no release: download the installer from the run's "Artifacts".
          retention-days: 7
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
          if-no-files-found: error

  publish:
    name: Publish Release Assets

    # Only a published release has a tag to upload to.
    if: github.event_name == 'release'

    needs:
      - build

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show release artifacts
        shell: bash
        run: |
          echo "Release assets:"

          find artifacts -type f \( \
            -name "*.msi" \
            -o -name "*.dmg" \
          \) -print

      - name: Remove existing release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release view "$TAG" \
            --json assets \
            --jq '.assets[].name' |
          while IFS= read -r asset; do
            case "$asset" in
              *.msi|*.dmg)
                echo "Deleting existing asset: $asset"
                gh release delete-asset "$TAG" "$asset" --yes
                ;;
              *)
                echo "Keeping unrelated asset: $asset"
                ;;
            esac
          done

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          find artifacts -type f \( \
            -name "*.msi" \
            -o -name "*.dmg" \
          \) -print0 |
          while IFS= read -r -d '' file; do
            echo "Uploading: $file"
            gh release upload "$TAG" "$file"
          done
