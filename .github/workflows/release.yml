name: Release

# A pushed tag v* (made by `npm version`) builds every platform into a DRAFT release; nothing reaches players
# until the draft is published. A manual run builds the branch picked in "Run workflow" and only keeps artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-22.04
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-version.js --check --tag "${{ github.ref_name }}"

  # One draft for the tag, made before the builds: when every build job looked for the draft itself, two jobs
  # could each create one (a draft can't be found by its tag), and the installers ended up split between them.
  release:
    name: Create the draft release
    needs: [version]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # A re-run reuses the draft of the first run.
          id=$(gh api "repos/$REPO/releases?per_page=100" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -n 1)
          if [ -z "$id" ]; then
            # v1.1.0-beta.1 and the like are pre-releases: "latest" ignores them, so no player is offered them.
            pre=false; case "$TAG" in *-*) pre=true;; esac
            id=$(gh api "repos/$REPO/releases" -X POST -f tag_name="$TAG" -f name="D³ $TAG" -F draft=true -F prerelease=$pre --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: [version, release]
    # The version check and the draft are skipped on manual runs, which must not stop the build.
    if: ${{ !cancelled() && needs.version.result != 'failure' && needs.release.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi
            artifact: windows
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: macos-apple-silicon
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
            artifact: macos-intel
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            artifact: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install the Linux packages Tauri needs
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      # Draft first, publish last: a tag push creates (or fills) a draft release, a manual run only builds.
      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updates are signed in CI only; local builds work without the key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # tauri-action writes latest.json (all platforms, with signatures) into the draft release.
          includeUpdaterJson: true
          # Upload into the one draft made above; a manual run has none and only builds.
          releaseId: ${{ needs.release.outputs.id }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":true}}'

      # The ad-hoc signature (signingIdentity "-") has to be complete, else Apple Silicon calls the app "damaged".
      - name: Verify the macOS signature
        if: startsWith(matrix.os, 'macos')
        run: |
          for app in src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
          done

      - name: Keep the installers of a manual run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          retention-days: 7
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
          if-no-files-found: error

  # Every platform has to be in latest.json, or players on the missing one never see the update.
  check:
    name: Check the draft
    needs: [release, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ID: ${{ needs.release.outputs.id }}
        run: |
          url=$(gh api "repos/$REPO/releases/$ID" --jq '.assets[] | select(.name == "latest.json") | .url')
          [ -n "$url" ] || { echo "latest.json is missing in the draft"; exit 1; }
          gh api -H "Accept: application/octet-stream" "$url" > latest.json
          for p in darwin-aarch64 darwin-x86_64 windows-x86_64 linux-x86_64; do
            jq -e --arg p "$p" '.platforms[$p].url' latest.json > /dev/null || { echo "latest.json has no $p"; exit 1; }
          done
          echo "latest.json has all platforms:"; jq '.platforms | keys' latest.json
