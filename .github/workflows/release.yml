name: Release

# A pushed tag v* builds every platform into a DRAFT release, checks it, and only then publishes it as the latest
# release. While the assets upload the release is a draft, so the updater never sees a half-filled release; if any
# build or the check fails, it stays a draft and players keep the previous version.
# A manual run builds the branch picked in "Run workflow" and only keeps artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the jobs that make, fill or read the draft release get write access.
permissions:
  contents: read

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-22.04
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # The tag goes in through the environment, never pasted into the script.
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/sync-version.js --check --tag "$TAG"
          # No release without its notes: CHANGELOG.md needs a section for this version.
          node scripts/release-notes.js "$TAG" > /dev/null

  # One draft for the tag, made before the builds: when every build job looked for the draft itself, two jobs
  # could each create one (a draft can't be found by its tag), and the installers ended up split between them.
  release:
    name: Create the draft release
    needs: [version]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # The notes of this version from CHANGELOG.md: the release text, and through latest.json what the app shows.
          node scripts/release-notes.js "$TAG" > notes.md
          # A re-run reuses the draft of the first run (and refreshes its notes).
          id=$(gh api "repos/$REPO/releases?per_page=100" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api "repos/$REPO/releases/$id" -X PATCH -F body=@notes.md > /dev/null
          else
            # v1.1.0-beta.1 and the like are pre-releases: "latest" ignores them, so no player is offered them.
            pre=false; case "$TAG" in *-*) pre=true;; esac
            id=$(gh api "repos/$REPO/releases" -X POST -f tag_name="$TAG" -f name="D³ $TAG" -F draft=true -F prerelease=$pre -F body=@notes.md --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: [version, release]
    # The version check and the draft are skipped on manual runs, which must not stop the build.
    if: ${{ !cancelled() && needs.version.result != 'failure' && needs.release.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            # NSIS setup .exe only, installed for the current user: no admin prompt, also not on updates.
            bundles: nsis
            artifact: windows
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: macos-apple-silicon
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
            artifact: macos-intel
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            artifact: linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the Linux packages Tauri needs
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # No install scripts: nothing the app needs uses them, and they would run next to the signing key.
      - run: npm ci --ignore-scripts
      - run: npm test

      # Draft first, publish last: a tag push creates (or fills) a draft release, a manual run only builds.
      - name: Build
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updates are signed in CI only; local builds work without the key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # tauri-action writes latest.json (all platforms, with signatures) into the draft release.
          includeUpdaterJson: true
          # Upload into the one draft made above; a manual run has none and only builds.
          releaseId: ${{ needs.release.outputs.id }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":true}}'

      # The ad-hoc signature (signingIdentity "-") has to be complete, else Apple Silicon calls the app "damaged".
      - name: Verify the macOS signature
        if: startsWith(matrix.os, 'macos')
        run: |
          for app in src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
          done

      - name: Keep the installers of a manual run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          retention-days: 7
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
          if-no-files-found: error

  # Every platform has to be in latest.json, or players on the missing one never see the update.
  check:
    name: Check the draft
    needs: [release, build]
    if: github.ref_type == 'tag'
    # Draft releases are only visible with write access.
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ID: ${{ needs.release.outputs.id }}
        run: |
          url=$(gh api "repos/$REPO/releases/$ID" --jq '.assets[] | select(.name == "latest.json") | .url')
          [ -n "$url" ] || { echo "latest.json is missing in the draft"; exit 1; }
          gh api -H "Accept: application/octet-stream" "$url" > latest.json
          gh api "repos/$REPO/releases/$ID" --jq '.assets[].name' > assets.txt
          for p in darwin-aarch64 darwin-x86_64 windows-x86_64 linux-x86_64; do
            url=$(jq -r --arg p "$p" '.platforms[$p].url // empty' latest.json)
            [ -n "$url" ] || { echo "latest.json has no $p"; exit 1; }
            sig=$(jq -r --arg p "$p" '.platforms[$p].signature // empty' latest.json)
            [ -n "$sig" ] || { echo "latest.json has no signature for $p"; exit 1; }
            # The update package latest.json points to must be in this release, or the update fails on that platform.
            name=$(basename "$url")
            grep -qxF "$name" assets.txt || { echo "$p: $name is not an asset of the draft"; exit 1; }
          done
          echo "latest.json has all platforms:"; jq '.platforms | keys' latest.json

  # The last step: the checked draft goes public. Publishing is what the apps' update check sees
  # (releases/latest/download/latest.json), so it happens only once everything above is green.
  publish:
    name: Publish the release
    needs: [release, check]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ID: ${{ needs.release.outputs.id }}
          TAG: ${{ github.ref_name }}
        run: |
          # v1.1.0-beta.1 and the like go out as pre-releases, never as latest: no player is offered them.
          latest=true; case "$TAG" in *-*) latest=false;; esac
          url=$(gh api "repos/$REPO/releases/$ID" -X PATCH -F draft=false -f make_latest="$latest" --jq .html_url)
          echo "Published $TAG (latest: $latest): $url"
